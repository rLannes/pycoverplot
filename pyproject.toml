[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pycoverplot"
dynamic = ["version"]
description = "BAM coverage plot"
dependencies = [
    "numpy",
    "matplotlib",
    "gtf-pyparser==0.2.1",
    "Rust-covpyo3==0.2.4",
]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Romain Lannes", email = "rlannes@wi.mit.edu" }
]
keywords = ["bioinformatics", "BAM", "visualisation", "plotting", "rnaseq",  "genomics", "Alignment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/rLannes/pycoverplot"
Repository = "https://github.com/rLannes/pycoverplot"
Issues = "https://github.com/rLannes/pycoverplot/issues"

[project.scripts]
pycoverplot = "pycoverplot.coverage_plot:main"
pycoverplot_gtf = "pycoverplot.coverage_plot:main_pkl"

[tool.setuptools.packages.find]
where = ["."]
include = ["pycoverplot*"]

[project.optional-dependencies]
test = ["pytest>=7.0"]